<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Case study progress</title>
<link rel="stylesheet" href="assets/case.css">
<style>
.dash{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.dash h1{font-size:30px;font-weight:800}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:14px 0 18px}
.ctl label{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.ctl input{font:inherit;padding:7px 9px;border:2px solid var(--line);border-radius:6px;background:#fff}
.ctl .stamp{font-size:13px;color:var(--muted);margin:0 0 8px}
.grid{display:grid;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h2{font-size:21px;font-weight:800}
.card .chap{font-size:13px;font-weight:700;color:var(--muted)}
.link{font-size:13px;word-break:break-all;margin:4px 0 10px;color:var(--muted)}
.big{display:flex;gap:36px;margin:8px 0 14px}
.big div b{display:block;font-size:54px;line-height:1;font-weight:800;color:var(--dark)}
.big div span{color:var(--muted);font-size:14px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 76px;gap:10px;align-items:center;margin:7px 0}
.bar .t{font-weight:700;font-size:14px}
.bar .rail{height:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--violet);transition:width .4s}
.bar .n{text-align:right;font-weight:700;font-size:14px}
.idle{color:var(--muted);font-size:14px;margin:6px 0 0}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px}
</style>
</head>
<body>
<main class="dash">
  <h1>Case study progress</h1>
  <div class="ctl">
    <div><label for="run">Session (date or code)</label><input id="run" size="12"></div>
    <p class="stamp" id="stamp"></p>
  </div>
  <div id="out" class="grid"></div>
</main>
<script src="config.js"></script>
<script>
(function(){
  var CASES=[{id:"ch3",chap:"Chapter 3"},{id:"ch4",chap:"Chapter 4"}];
  var cfg=window.CASE_CONFIG||{}, $=function(i){return document.getElementById(i);};
  var d=new Date(), p=function(n){return (n<10?"0":"")+n;}, today=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  var q=new URLSearchParams(location.search), timer=null;
  $("run").value=q.get("run")||today;
  function runCode(){ return $("run").value.replace(/[^A-Za-z0-9_-]/g,"").slice(0,20)||"default"; }

  function loadCases(i,cb){
    if(i>=CASES.length) return cb();
    var s=document.createElement("script"); s.src=CASES[i].id+"/case-data.js";
    s.onload=function(){ CASES[i].title=window.CASE.title; CASES[i].tasks=window.CASE.tasks.map(function(t){return t.title;}); loadCases(i+1,cb); };
    s.onerror=function(){ CASES[i].title=CASES[i].id; CASES[i].tasks=[]; loadCases(i+1,cb); };
    document.head.appendChild(s);
  }
  function card(c,data){
    var base=location.href.replace(/dashboard\.html.*$/,""), run=runCode();
    var u=base+c.id+"/"+(run===today?"":"?run="+encodeURIComponent(run));
    var n=c.tasks.length, sessions=Object.keys(data||{}), started=sessions.length, cnt=[], i;
    for(i=1;i<=n;i++) cnt.push(sessions.filter(function(s){return data[s]["s"+i]!=null;}).length);
    var h='<section class="card"><div class="chap">'+c.chap+'</div><h2>'+c.title+'</h2>'+
      '<p class="link">Link for students: <a href="'+u+'">'+u+'</a></p>'+
      '<div class="big"><div><b>'+started+'</b><span>teams started</span></div><div><b>'+(cnt[n-1]||0)+'</b><span>teams finished</span></div></div>';
    c.tasks.forEach(function(t,k){
      var pct=started?Math.round(cnt[k]/started*100):0;
      h+='<div class="bar"><div class="t">'+(k+1)+'. '+t+'</div><div class="rail"><div class="fill" style="width:'+pct+'%"></div></div><div class="n">'+cnt[k]+' ('+pct+'%)</div></div>';
    });
    if(!started) h+='<p class="idle">No team has started in this session yet.</p>';
    return h+'</section>';
  }
  function tick(){
    if(!cfg.firebaseUrl){
      $("out").innerHTML='<p class="note"><strong>Live overview is not set up yet.</strong> Enter the URL of your Firebase Realtime Database in <code>config.js</code>. The README explains the steps.</p>';
      return;
    }
    var base=cfg.firebaseUrl.replace(/\/+$/,""), run=runCode();
    Promise.all(CASES.map(function(c){
      return fetch(base+"/progress/"+c.id+"/"+run+".json",{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
    })).then(function(all){
      $("out").innerHTML=CASES.map(function(c,i){return card(c,all[i]);}).join("");
      $("stamp").textContent="Updated "+new Date().toLocaleTimeString()+". Refreshes every 5 seconds.";
    }).catch(function(e){ $("stamp").textContent="Could not read the database ("+e.message+"). Check the URL in config.js and the database rules."; });
  }
  function start(){ clearInterval(timer); tick(); timer=setInterval(tick,5000); }
  $("run").onchange=start;
  loadCases(0,start);
})();
</script>
</body>
</html>
